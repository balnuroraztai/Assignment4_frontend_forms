
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Task 2 - Bootstrap Form</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    
    <link rel="stylesheet" href="task2.css">
</head>

<body>

    <nav class="navbar navbar-expand bg-purple">
        <div class="container-fluid justify-content-center">
            <div class="navbar-nav flex-row flex-wrap justify-content-center">
                <a class="nav-link" href="index.html">Task 0</a>
                <a class="nav-link" href="task1.html">Task 1</a>
                <a class="nav-link" href="task2.html">Task 2</a>
                <a class="nav-link" href="task3.html">Task 3</a>
                <a class="nav-link" href="task4.html">Task 4</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="form-card mx-auto">

            <h1 class="text-center">Bootstrap Contact Form</h1>

            <p class="text-center text-muted">
                We would love to hear from you!
            </p>

            <form>

                <div class="row g-3">

                    <div class="col-12 col-md-6">
                        <label for="name" class="form-label">
                            Name
                        </label>
                        <input type="text"
                               class="form-control"
                               id="name"
                               name="name"
                               placeholder="Enter your name">
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="email" class="form-label">
                            Email
                        </label>
                        <input type="email"
                               class="form-control"
                               id="email"
                               name="email"
                               placeholder="Enter your email">
                        <div class="form-text">
                            We'll never share your email.
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="message" class="form-label">
                            Message
                        </label>
                        <textarea class="form-control"
                                  id="message"
                                  name="message"
                                  rows="5"
                                  placeholder="Write your message here"></textarea>
                    </div>

                    <div class="col-12">
                        <button type="submit"
                                class="btn btn-primary w-100">
                            Send Message
                        </button>
                    </div>

                </div>

            </form>

        </div>
    </div>

</body>
</html>
