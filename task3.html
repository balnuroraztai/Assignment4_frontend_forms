
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Bootstrap Validation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="task3.css">
</head>
<body>

    <nav>
        <a href="index.html">Task 0</a>
        <a href="task1.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="task3.html">Task 3</a>
        <a href="task4.html">Task 4</a>
    </nav>

    <div class="container">
        <div class="form-card">
            <h1>Bootstrap Form Validation</h1>
            <p>Fill in the form to see validation feedback</p>

            <form id="contactForm" novalidate>
                <div class="row g-3">

                    <div class="col-12">
                        <label for="name" class="form-label">Name</label>
                        <input type="text"
                               class="form-control"
                               id="name"
                               name="name"
                               placeholder="Enter your name"
                               minlength="2"
                               required>

                        <div class="valid-feedback">Looks good!</div>
                        <div class="invalid-feedback">
                            Please enter at least 2 characters.
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="email" class="form-label">Email</label>
                        <input type="email"
                               class="form-control"
                               id="email"
                               name="email"
                               placeholder="Enter your email"
                               required>

                        <div class="valid-feedback">Looks good!</div>
                        <div class="invalid-feedback">
                            Please enter a valid email address.
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control"
                                  id="message"
                                  name="message"
                                  rows="4"
                                  placeholder="Write your message"
                                  minlength="10"
                                  required></textarea>

                        <div class="valid-feedback">Looks good!</div>
                        <div class="invalid-feedback">
                            Message must contain at least 10 characters.
                        </div>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-primary w-100">
                            Send Message
                        </button>
                    </div>

                </div>
            </form>

        </div>
    </div>

     
    <script src="task3.js"> </script>
</body>
</html>
