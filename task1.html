    <div class="container">
        <h1>HTML5 Form Validation</h1>
        <p>Please complete all required fields.</p>

        <form>
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                required
                minlength="2"
                maxlength="30"
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                rows="5"
                required
                minlength="10"
                maxlength="300"
            ></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>

</body>
</html>
